[project]
name = "bedrock-backend"
version = "0.1.0"
description = "Backend API server boilerplate"
readme = "README.md"
authors = [
    { name = "daichi-yoshikawa", email = "daichi.yoshikawa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.14.3",
    "celery==5.6.3",
    "django==5.2.12",
    "django-celery-beat==2.9.0",
    "django-cleanup==9.0.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.13.0",
    "django-extensions==4.1",
    "django-ipware==7.0.1",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "email-validator==2.3.0",
    "factory-boy==3.3.3",
    "faiss-cpu==1.13.2",
    "google-api-python-client==2.194.0",
    "google-auth==2.49.2",
    "gunicorn==25.3.0",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-checkpoint",
    "langsmith",
    "lingua-language-detector",
    "openai",
    "openpyxl==3.1.5",
    "pillow==12.2.0",
    "psycopg[binary]>=3.3.3",
    "pydantic==2.12.0",
    "pytest==9.0.3",
    "pytest-django==4.12.0",
    "pytest-env==1.6.0",
    "pytest-factoryboy==2.8.1",
    "pytest-order==1.3.0",
    "pytest-xdist==3.8.0",
    "redis==7.4.0",
    "tiktoken",
    "uvicorn[standard]==0.44.0",
    "whitenoise==6.12.0",
    "workos==6.2.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
